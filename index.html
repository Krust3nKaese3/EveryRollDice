<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Würfel Roller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .header {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .dice-selector {
            text-align: center;
            margin-bottom: 20px;
        }

        .dice-selector label {
            display: block;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: 600;
        }

        .dice-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .dice-count-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dice-count-btn.active {
            background: white;
            color: #667eea;
            border-color: white;
            transform: scale(1.1);
        }

        .dice-count-btn:active {
            transform: scale(0.95);
        }

        .dice-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            min-height: 180px;
            align-items: center;
            margin: 20px 0;
        }

        .dice {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #667eea;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s;
        }

        .dice.rolling {
            animation: roll 0.6s ease-in-out;
        }

        @keyframes roll {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(180deg) scale(1.1); }
            50% { transform: rotate(360deg) scale(1); }
            75% { transform: rotate(540deg) scale(1.1); }
            100% { transform: rotate(720deg) scale(1); }
        }

        .sum-display {
            text-align: center;
            margin: 20px 0;
            padding: 16px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        .sum-display .label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .sum-display .value {
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .history-section {
            margin-top: 20px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-header h2 {
            font-size: 18px;
        }

        .clear-history-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .history-list {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            backdrop-filter: blur(10px);
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            padding: 8px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .history-empty {
            text-align: center;
            padding: 20px;
            opacity: 0.7;
            font-size: 14px;
        }

        .shake-hint {
            text-align: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            margin-top: 12px;
            font-size: 14px;
            opacity: 0.9;
        }

        .no-bridge-warning {
            background: rgba(255, 193, 7, 0.9);
            color: #333;
            padding: 12px;
            border-radius: 8px;
            margin: 12px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎲 Würfel Roller</h1>
        <p class="subtitle">Würfle mit bis zu 6 Würfeln</p>
    </div>

    <div id="noBridgeWarning" class="no-bridge-warning" style="display: none;">
        ⚠️ Bridge nicht verfügbar - läuft außerhalb von EveryApp (eingeschränkter Modus)
    </div>

    <div class="main-content">
        <div class="dice-selector">
            <label>Anzahl Würfel wählen:</label>
            <div class="dice-buttons">
                <button class="dice-count-btn" data-count="1">1</button>
                <button class="dice-count-btn" data-count="2">2</button>
                <button class="dice-count-btn" data-count="3">3</button>
                <button class="dice-count-btn" data-count="4">4</button>
                <button class="dice-count-btn" data-count="5">5</button>
                <button class="dice-count-btn active" data-count="6">6</button>
            </div>
        </div>

        <div class="dice-container" id="diceContainer"></div>

        <div class="sum-display">
            <div class="label">Summe</div>
            <div class="value" id="sumValue">0</div>
        </div>

        <div class="controls">
            <button class="btn" id="rollBtn">
                🎲 Würfeln
            </button>
            <button class="btn btn-secondary" id="shakeBtn">
                📳 Schüttel-Erkennung: <span id="shakeStatus">AUS</span>
            </button>
        </div>

        <div class="shake-hint" id="shakeHint" style="display: none;">
            💡 Schüttle dein Gerät zum Würfeln!
        </div>

        <div class="history-section">
            <div class="history-header">
                <h2>📜 Wurf-Historie</h2>
                <button class="clear-history-btn" id="clearHistoryBtn">Löschen</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">Noch keine Würfe</div>
            </div>
        </div>
    </div>

    <script>
        // Globals
        let diceCount = 6;
        let currentValues = [];
        let history = [];
        let isRolling = false;
        let shakeEnabled = false;
        let lastShakeTime = 0;
        let accelerometerInterval = null;
        const SHAKE_THRESHOLD = 15;
        const SHAKE_COOLDOWN = 1000;

        // Bridge availability
        const hasBridge = typeof window.EveryAppBridge !== 'undefined';
        if (!hasBridge) {
            document.getElementById('noBridgeWarning').style.display = 'block';
        }

        // Initialize
        initDice();
        loadHistory();
        setupEventListeners();

        function setupEventListeners() {
            // Dice count selection
            document.querySelectorAll('.dice-count-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.dice-count-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    diceCount = parseInt(btn.dataset.count);
                    initDice();
                });
            });

            // Roll button
            document.getElementById('rollBtn').addEventListener('click', () => {
                rollDice();
            });

            // Shake toggle
            document.getElementById('shakeBtn').addEventListener('click', () => {
                toggleShakeDetection();
            });

            // Clear history
            document.getElementById('clearHistoryBtn').addEventListener('click', () => {
                clearHistory();
            });
        }

        function initDice() {
            const container = document.getElementById('diceContainer');
            container.innerHTML = '';
            currentValues = [];

            for (let i = 0; i < diceCount; i++) {
                const dice = document.createElement('div');
                dice.className = 'dice';
                dice.textContent = '?';
                dice.id = `dice-${i}`;
                container.appendChild(dice);
                currentValues.push(0);
            }

            updateSum();
        }

        async function rollDice() {
            if (isRolling) return;
            isRolling = true;
            document.getElementById('rollBtn').disabled = true;

            // Vibrate
            if (hasBridge) {
                try {
                    await window.EveryAppBridge.vibration.vibrate([50, 30, 50]);
                } catch (error) {
                    console.error('Vibration failed:', error);
                }
            }

            // Animate
            const diceElements = document.querySelectorAll('.dice');
            diceElements.forEach(dice => dice.classList.add('rolling'));

            // Random rolling animation
            const animationDuration = 600;
            const animationInterval = setInterval(() => {
                diceElements.forEach((dice, i) => {
                    dice.textContent = Math.floor(Math.random() * 6) + 1;
                });
            }, 80);

            setTimeout(() => {
                clearInterval(animationInterval);

                // Final values
                currentValues = [];
                diceElements.forEach((dice, i) => {
                    const value = Math.floor(Math.random() * 6) + 1;
                    currentValues.push(value);
                    dice.textContent = value;
                    dice.classList.remove('rolling');
                });

                updateSum();
                addToHistory();
                isRolling = false;
                document.getElementById('rollBtn').disabled = false;
            }, animationDuration);
        }

        function updateSum() {
            const sum = currentValues.reduce((a, b) => a + b, 0);
            document.getElementById('sumValue').textContent = sum;
        }

        async function addToHistory() {
            const sum = currentValues.reduce((a, b) => a + b, 0);
            const timestamp = new Date().toLocaleTimeString('de-DE');
            const entry = {
                dice: [...currentValues],
                sum: sum,
                time: timestamp
            };

            history.unshift(entry);
            if (history.length > 20) {
                history = history.slice(0, 20);
            }

            await saveHistory();
            renderHistory();
        }

        function renderHistory() {
            const listEl = document.getElementById('historyList');
            
            if (history.length === 0) {
                listEl.innerHTML = '<div class="history-empty">Noch keine Würfe</div>';
                return;
            }

            listEl.innerHTML = history.map(entry => `
                <div class="history-item">
                    <span>${entry.dice.join(' + ')} = ${entry.sum}</span>
                    <span style="opacity: 0.7;">${entry.time}</span>
                </div>
            `).join('');
        }

        async function clearHistory() {
            history = [];
            await saveHistory();
            renderHistory();
        }

        async function saveHistory() {
            if (!hasBridge) {
                try {
                    localStorage.setItem('dice_history', JSON.stringify(history));
                } catch (e) {
                    console.error('LocalStorage save failed:', e);
                }
                return;
            }

            try {
                await window.EveryAppBridge.storage.set('dice_history', JSON.stringify(history));
            } catch (error) {
                console.error('Failed to save history:', error);
            }
        }

        async function loadHistory() {
            if (!hasBridge) {
                try {
                    const stored = localStorage.getItem('dice_history');
                    if (stored) {
                        history = JSON.parse(stored);
                        renderHistory();
                    }
                } catch (e) {
                    console.error('LocalStorage load failed:', e);
                }
                return;
            }

            try {
                const stored = await window.EveryAppBridge.storage.get('dice_history');
                if (stored) {
                    history = JSON.parse(stored);
                    renderHistory();
                }
            } catch (error) {
                console.error('Failed to load history:', error);
            }
        }

        async function toggleShakeDetection() {
            shakeEnabled = !shakeEnabled;
            const statusEl = document.getElementById('shakeStatus');
            const hintEl = document.getElementById('shakeHint');
            const btn = document.getElementById('shakeBtn');

            if (shakeEnabled) {
                statusEl.textContent = 'AN';
                hintEl.style.display = 'block';
                btn.style.background = 'rgba(255, 255, 255, 0.3)';
                startShakeDetection();
            } else {
                statusEl.textContent = 'AUS';
                hintEl.style.display = 'none';
                btn.style.background = 'rgba(255, 255, 255, 0.2)';
                stopShakeDetection();
            }
        }

        function startShakeDetection() {
            if (!hasBridge) {
                // Fallback: use DeviceMotion API in browser
                if (window.DeviceMotionEvent) {
                    window.addEventListener('devicemotion', handleDeviceMotion);
                }
                return;
            }

            // Poll accelerometer via bridge
            accelerometerInterval = setInterval(async () => {
                try {
                    const data = await window.EveryAppBridge.sensors.getAccelerometer();
                    const magnitude = Math.sqrt(data.x * data.x + data.y * data.y + data.z * data.z);
                    
                    if (magnitude > SHAKE_THRESHOLD) {
                        const now = Date.now();
                        if (now - lastShakeTime > SHAKE_COOLDOWN && !isRolling) {
                            lastShakeTime = now;
                            rollDice();
                        }
                    }
                } catch (error) {
                    console.error('Accelerometer read failed:', error);
                }
            }, 100);
        }

        function stopShakeDetection() {
            if (accelerometerInterval) {
                clearInterval(accelerometerInterval);
                accelerometerInterval = null;
            }

            if (window.DeviceMotionEvent) {
                window.removeEventListener('devicemotion', handleDeviceMotion);
            }
        }

        function handleDeviceMotion(event) {
            if (!shakeEnabled || isRolling) return;

            const acc = event.accelerationIncludingGravity;
            if (!acc) return;

            const magnitude = Math.sqrt(
                (acc.x || 0) * (acc.x || 0) + 
                (acc.y || 0) * (acc.y || 0) + 
                (acc.z || 0) * (acc.z || 0)
            );

            if (magnitude > SHAKE_THRESHOLD * 2) {
                const now = Date.now();
                if (now - lastShakeTime > SHAKE_COOLDOWN) {
                    lastShakeTime = now;
                    rollDice();
                }
            }
        }

        // Cleanup on unload
        window.addEventListener('beforeunload', () => {
            stopShakeDetection();
        });
    </script>
</body>
</html>
